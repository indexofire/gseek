[package]
name = "gseek-ispcr-fast"
version = "0.1.0"
edition = "2021"
description = "Optional in-silico PCR site scanner for gseek (q-gram index + bit-parallel edit distance)"
license = "MIT"
publish = false

[lib]
name = "_ispcr_fast"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
